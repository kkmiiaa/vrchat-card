name: E2E Tests

# `run-test` ラベルをPRに付与したときだけ実行する。
# ブランチ保護の required status check に "playwright" を追加することで、
# ラベルを付けてテストを走らせた場合はパスがマージの条件になる。
on:
  pull_request:
    types: [labeled]

jobs:
  playwright:
    name: playwright
    if: github.event.label.name == 'run-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase keys
        id: supabase-keys
        run: |
          echo "anon_key=$(supabase status -o json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT
          echo "service_role_key=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: npx playwright test --reporter=list,html
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase-keys.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase-keys.outputs.service_role_key }}
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: testpassword123
          NEXT_PUBLIC_TEST_USER_EMAIL: test@example.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
